[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hands-on-ml-study"
version = "0.1.0"
description = "Reusable utilities for hands-on machine learning study."
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/hands_on_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
